version: "3.9"

services:
  fraud-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Redis for distributed profile store
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
